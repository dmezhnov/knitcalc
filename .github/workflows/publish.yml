name: Publish

on:
    push:
        branches:
            - test

permissions:
    contents: write
    id-token: write
    pages: write

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    linux-android-web:
        name: Test and build Linux, Android, Web
        # Pinned to the oldest available LTS: the Linux bundle links the
        # build host's glib/glibc, so building on 24.04 produces binaries
        # that fail on older distros (undefined symbol
        # g_once_init_enter_pointer, glib >= 2.80). Binaries built here run
        # everywhere from 22.04 up, including the core24 snap.
        runs-on: ubuntu-22.04

        outputs:
            version: ${{ steps.version.outputs.version }}
            tag: ${{ steps.version.outputs.tag }}
            linux_sha256: ${{ steps.package.outputs.linux_sha256 }}

        steps:
            - name: Checkout test branch
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  ref: test

            - name: Resolve version
              id: version
              run: |
                  version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
                  tag="v${version}"
                  echo "version=${version}" >> "$GITHUB_OUTPUT"
                  echo "tag=${tag}" >> "$GITHUB_OUTPUT"

            - name: Ensure release tag is new
              run: |
                  if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}"; then
                    echo "Tag ${{ steps.version.outputs.tag }} already exists. Bump version in pubspec.yaml before publishing."
                    exit 1
                  fi

            # The ubuntu-22.04 image defaults to JDK 11, but the android-sdk
            # mise plugin validates sdkmanager during install, which needs
            # JDK 17+. Point the job at the preinstalled Temurin 17 before
            # mise runs (the mise-managed java is not on PATH at that point).
            - name: Use JDK 17 as the default Java
              run: |
                  echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
                  echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"

            - name: Install mise
              uses: jdx/mise-action@v4
              with:
                  # Pin mise for reproducible CI: 2026.6.14 restores dangling
                  # symlink shims from cache on Windows ("flutter.exe is not a
                  # valid shim"), breaking the Windows build; 2026.6.11 is the
                  # last release that builds cleanly. Bump once a newer mise
                  # fixes the Windows shim regression.
                  version: 2026.6.11

            - name: Install Linux build packages
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev liblzma-dev pkg-config

            - name: Run lint
              run: mise lint

            - name: Run tests
              run: mise test

            - name: Set up Android signing
              env:
                  ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
                  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
                  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
                  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
              run: |
                  if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
                    echo "::warning::ANDROID_KEYSTORE_BASE64 is not set; the release will use debug keys and won't install over a differently signed build."
                    exit 0
                  fi
                  for var in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
                    if [ -z "${!var}" ]; then
                      echo "::error::$var secret is empty; set all four ANDROID_* secrets (alias is 'knitcalc')."
                      exit 1
                    fi
                  done
                  keystore="$RUNNER_TEMP/knitcalc-release.jks"
                  # Strip any whitespace/newlines a copy-paste may have added.
                  if ! printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$keystore"; then
                    echo "::error::Could not base64-decode ANDROID_KEYSTORE_BASE64. Re-copy the full output of 'base64 -w0 knitcalc-release.jks'."
                    exit 1
                  fi
                  {
                    echo "ANDROID_KEYSTORE_PATH=$keystore"
                    echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
                    echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
                    echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
                  } >> "$GITHUB_ENV"

            - name: Build APK
              run: mise build apk

            - name: Build per-ABI APKs
              run: mise build apk-split

            - name: Build Android App Bundle
              run: mise build appbundle

            - name: Build Linux bundle
              run: mise build linux

            # Repacks the Linux bundle as a self-contained AppImage with
            # embedded zsync update info (AppImageUpdate can delta-update from
            # GitHub releases). The bundle already carries the desktop file and
            # icons via tool/linux_desktop_install.dart.
            - name: Build AppImage
              run: |
                  sudo apt-get install -y zsync
                  curl -fsSL -o /tmp/appimagetool \
                      https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
                  chmod +x /tmp/appimagetool
                  version='${{ steps.version.outputs.version }}'
                  appdir=build/AppDir
                  rm -rf "$appdir"
                  mkdir -p "$appdir/usr/bin" "$appdir/usr/share/metainfo"
                  cp -a build/linux/x64/release/bundle/. "$appdir/usr/bin/"
                  ln -s usr/bin/knitcalc "$appdir/AppRun"
                  sed 's|@EXEC@|knitcalc|' \
                      "$appdir/usr/bin/desktop/io.github.dmezhnov.knitcalc.desktop" \
                      > "$appdir/io.github.dmezhnov.knitcalc.desktop"
                  cp "$appdir/usr/bin/desktop/icons/hicolor/256x256/apps/io.github.dmezhnov.knitcalc.png" \
                      "$appdir/io.github.dmezhnov.knitcalc.png"
                  cp -a "$appdir/usr/bin/desktop/icons" "$appdir/usr/share/"
                  # The test-branch metainfo still lists the previous release (the
                  # publish job rewrites it on main); pin the current version here.
                  sed -E "s|<release version=\"[^\"]+\" date=\"[^\"]+\"/>|<release version=\"${version}\" date=\"$(date -u +%F)\"/>|" \
                      packaging/flatpak/io.github.dmezhnov.knitcalc.metainfo.xml \
                      > "$appdir/usr/share/metainfo/io.github.dmezhnov.knitcalc.metainfo.xml"
                  rm -rf "$appdir/usr/bin/desktop" "$appdir/usr/bin/install.sh" "$appdir/usr/bin/uninstall.sh"
                  ARCH=x86_64 /tmp/appimagetool --appimage-extract-and-run \
                      -u "gh-releases-zsync|dmezhnov|knitcalc|latest|knitcalc-*-x86_64.AppImage.zsync" \
                      "$appdir" "knitcalc-${version}-x86_64.AppImage"

            - name: Build web bundle
              run: mise build web

            - name: Package Linux, Android, Web
              id: package
              run: |
                  version='${{ steps.version.outputs.version }}'
                  rm -rf release
                  mkdir -p release/android release/linux release/web
                  cp build/app/outputs/flutter-apk/app-release.apk "release/android/knitcalc-${version}.apk"
                  for abi in arm64-v8a armeabi-v7a x86_64; do
                    cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" \
                       "release/android/knitcalc-${version}-${abi}.apk"
                  done
                  cp build/app/outputs/bundle/release/app-release.aab "release/android/knitcalc-${version}.aab"
                  tar -C build/linux/x64/release/bundle -czf "release/linux/knitcalc-linux-x64-${version}.tar.gz" .
                  mv "knitcalc-${version}-x86_64.AppImage" "knitcalc-${version}-x86_64.AppImage.zsync" release/linux/
                  tar -C build/web -czf "release/web/knitcalc-web-${version}.tar.gz" .
                  # The AUR PKGBUILD pins this hash.
                  echo "linux_sha256=$(sha256sum "release/linux/knitcalc-linux-x64-${version}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

            - name: Upload Linux, Android, Web artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: release-linux-android-web
                  path: release

            # Builds a .deb and a signed apt repo into build/web/apt, so it ships
            # inside the same Pages deploy (served at /knitcalc/apt). Skipped with
            # a warning until the signing key secret is configured, like the other
            # package-manager steps. See packaging/README.md.
            - name: Build apt repository
              env:
                  APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
                  APT_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
              run: |
                  if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
                    echo "::warning::APT_GPG_PRIVATE_KEY is not set; skipping the apt repository."
                    bash packaging/ci/channel_status.sh apt skipped "APT_GPG_PRIVATE_KEY is not set"
                    exit 0
                  fi
                  sudo apt-get install -y dpkg-dev apt-utils
                  export GNUPGHOME="$(mktemp -d)"
                  chmod 700 "$GNUPGHOME"
                  # -i: the stored secret may carry stray non-base64 characters
                  # (it did once); gpg --import below still validates the key.
                  if ! printf '%s' "$APT_GPG_PRIVATE_KEY" | tr -d '[:space:]' | base64 -di \
                      | gpg --batch --pinentry-mode loopback \
                            ${APT_GPG_PASSPHRASE:+--passphrase "$APT_GPG_PASSPHRASE"} \
                            --import; then
                    echo "::error::Could not import APT_GPG_PRIVATE_KEY. Store it as base64 of the armored secret key (gpg --armor --export-secret-keys KEYID | base64 -w0)."
                    exit 1
                  fi
                  key_id="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
                  VERSION='${{ steps.version.outputs.version }}' \
                  BUNDLE_DIR='build/linux/x64/release/bundle' \
                  OUT_DIR='build/web' \
                  GPG_KEY_ID="$key_id" \
                  GPG_PASSPHRASE="$APT_GPG_PASSPHRASE" \
                    bash packaging/apt/build-repo.sh
                  bash packaging/ci/channel_status.sh apt ok "${{ steps.version.outputs.version }}"

            - name: Upload GitHub Pages artifact
              uses: actions/upload-pages-artifact@v5
              with:
                  path: build/web

            - name: Upload channel status
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: channel-status-linux-android-web
                  path: channel-status
                  if-no-files-found: ignore

    windows:
        name: Build Windows
        runs-on: windows-latest
        needs: linux-android-web

        outputs:
            # zip hash for Scoop/Chocolatey; setup_sha256 for the winget (inno) manifest.
            sha256: ${{ steps.package.outputs.sha256 }}
            setup_sha256: ${{ steps.package.outputs.setup_sha256 }}

        steps:
            - name: Checkout test branch
              uses: actions/checkout@v5
              with:
                  ref: test

            - name: Install mise
              uses: jdx/mise-action@v4
              with:
                  # Pin mise for reproducible CI: 2026.6.14 restores dangling
                  # symlink shims from cache on Windows ("flutter.exe is not a
                  # valid shim"), breaking the Windows build; 2026.6.11 is the
                  # last release that builds cleanly. Bump once a newer mise
                  # fixes the Windows shim regression.
                  version: 2026.6.11

            - name: Enable Windows desktop
              run: flutter config --enable-windows-desktop

            - name: Build Windows bundle
              run: mise build windows

            # Build the per-user installer that winget and direct downloads use,
            # and that the in-app self-update runs (see packaging/inno/knitcalc.iss).
            # choco install is idempotent and shims ISCC onto PATH, so this works
            # whether or not the runner image preinstalls Inno Setup.
            - name: Build Inno Setup installer
              shell: pwsh
              run: |
                  choco install innosetup -y --no-progress
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                  iscc /DAppVersion=${{ needs.linux-android-web.outputs.version }} packaging/inno/knitcalc.iss
                  if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            - name: Package Windows bundle
              id: package
              shell: pwsh
              run: |
                  Remove-Item -Recurse -Force release -ErrorAction SilentlyContinue
                  New-Item -ItemType Directory -Force -Path release/windows
                  # Zip: consumed by Scoop and Chocolatey (their shims resolve the
                  # adjacent DLLs correctly, unlike the winget portable alias).
                  $zip = "release/windows/knitcalc-windows-x64-${{ needs.linux-android-web.outputs.version }}.zip"
                  Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath $zip
                  # The Scoop manifest and Chocolatey submission pin this hash.
                  $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
                  "sha256=$sha" >> $env:GITHUB_OUTPUT
                  # Installer: winget (inno) and the in-app self-update; carry it
                  # into release/ so the GitHub release attaches it.
                  $setup = "knitcalc-setup-x64-${{ needs.linux-android-web.outputs.version }}.exe"
                  Copy-Item "build/installer/$setup" "release/windows/$setup"
                  $setupSha = (Get-FileHash "release/windows/$setup" -Algorithm SHA256).Hash.ToLower()
                  "setup_sha256=$setupSha" >> $env:GITHUB_OUTPUT

            - name: Upload Windows artifact
              uses: actions/upload-artifact@v7
              with:
                  name: release-windows
                  path: release

    apple:
        name: Build macOS and iOS
        runs-on: macos-latest
        needs: linux-android-web

        outputs:
            sha256: ${{ steps.package.outputs.sha256 }}

        steps:
            - name: Checkout test branch
              uses: actions/checkout@v5
              with:
                  ref: test

            - name: Install mise
              uses: jdx/mise-action@v4
              with:
                  # Pin mise for reproducible CI: 2026.6.14 restores dangling
                  # symlink shims from cache on Windows ("flutter.exe is not a
                  # valid shim"), breaking the Windows build; 2026.6.11 is the
                  # last release that builds cleanly. Bump once a newer mise
                  # fixes the Windows shim regression.
                  version: 2026.6.11

            - name: Enable Apple desktop
              run: flutter config --enable-macos-desktop

            # Exercises the real macOS swap script (ditto extract + full .app
            # replace + open) on a native macOS host — the live-update step we
            # cannot run locally without a Mac.
            - name: Run macOS swap e2e test
              run: flutter test test/update/macos_swap_e2e_test.dart

            - name: Build macOS bundle
              run: mise build macos

            - name: Build unsigned iOS app
              run: mise build ios

            - name: Package Apple bundles
              id: package
              run: |
                  rm -rf release
                  mkdir -p release/macos release/ios
                  macos_zip="release/macos/knitcalc-macos-${{ needs.linux-android-web.outputs.version }}.zip"
                  ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/knitcalc.app "$macos_zip"
                  ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app "release/ios/knitcalc-ios-unsigned-${{ needs.linux-android-web.outputs.version }}.zip"
                  # The Homebrew cask pins this hash (rendered on main by the publish job).
                  sha=$(shasum -a 256 "$macos_zip" | awk '{print $1}')
                  echo "sha256=$sha" >> "$GITHUB_OUTPUT"

            - name: Upload Apple artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: release-apple
                  path: release

    publish:
        name: Publish release
        runs-on: ubuntu-latest
        needs:
            - linux-android-web
            - windows
            - apple
        env:
            # Mapped here so the Firestore steps can gate on its presence in an
            # `if:` without referencing the secret directly.
            FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}

        steps:
            - name: Checkout main branch
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  ref: main
                  ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

            - name: Resolve Windows zip URL
              id: windows-zip
              run: |
                  version="${{ needs.linux-android-web.outputs.version }}"
                  echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/knitcalc-windows-x64-${version}.zip" >> "$GITHUB_OUTPUT"

            - name: Resolve macOS zip URL
              id: macos-zip
              run: |
                  version="${{ needs.linux-android-web.outputs.version }}"
                  echo "url=https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/knitcalc-macos-${version}.zip" >> "$GITHUB_OUTPUT"

            - name: Merge test branch
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git merge --no-edit -X theirs origin/test || true
                  # Accept test's side for leftover release/ conflicts (rename/delete or modify/delete).
                  git rm -rf --ignore-unmatch release/
                  if [ -n "$(git ls-files --unmerged)" ]; then
                      echo "Unresolved conflicts outside release/:"
                      git ls-files --unmerged
                      exit 1
                  fi
                  if [ -f .git/MERGE_HEAD ]; then
                      git commit --no-edit
                  fi

            # The repo doubles as the Scoop bucket (`scoop bucket add knitcalc
            # https://github.com/dmezhnov/knitcalc`): each release pins the new
            # version's URL and hash into bucket/knitcalc.json on main, so no
            # separate bucket repo or extra token is needed.
            - name: Render Scoop bucket manifest
              run: |
                  mkdir -p bucket
                  sed -e 's|{{VERSION}}|${{ needs.linux-android-web.outputs.version }}|' \
                      -e 's|{{URL}}|${{ steps.windows-zip.outputs.url }}|' \
                      -e 's|{{SHA256}}|${{ needs.windows.outputs.sha256 }}|' \
                      packaging/scoop/knitcalc.json > bucket/knitcalc.json
                  git add bucket/knitcalc.json
                  git commit -m "Scoop manifest ${{ needs.linux-android-web.outputs.version }}"

            # The repo also doubles as a Homebrew tap (`brew tap dmezhnov/knitcalc
            # https://github.com/dmezhnov/knitcalc`): each release pins the macOS
            # zip URL and hash into Casks/knitcalc.rb on main, mirroring the Scoop
            # bucket. No separate tap repo or token is needed.
            - name: Render Homebrew cask
              run: |
                  mkdir -p Casks
                  sed -e 's|{{VERSION}}|${{ needs.linux-android-web.outputs.version }}|' \
                      -e 's|{{URL}}|${{ steps.macos-zip.outputs.url }}|' \
                      -e 's|{{SHA256}}|${{ needs.apple.outputs.sha256 }}|' \
                      packaging/homebrew/knitcalc.rb > Casks/knitcalc.rb
                  git add Casks/knitcalc.rb
                  git commit -m "Homebrew cask ${{ needs.linux-android-web.outputs.version }}"

            # And the repo doubles as its own mise plugin (`mise plugin install
            # knitcalc https://github.com/dmezhnov/knitcalc`): mise clones the
            # repository and reads metadata.lua/hooks/ from its root, so the
            # generated plugin tree is copied there on main. Unlike the bucket
            # and the cask it carries no version — the plugin asks the GitHub
            # API — so it only commits when the plugin itself changed.
            - name: Render mise plugin
              run: |
                  rm -rf hooks metadata.lua knitcalc.lua
                  cp -R packaging/mise/plugin/. .
                  git add metadata.lua knitcalc.lua hooks
                  if git diff --cached --quiet -- metadata.lua knitcalc.lua hooks; then
                    echo "mise plugin unchanged."
                  else
                    git commit -m "mise plugin ${{ needs.linux-android-web.outputs.version }}"
                  fi

            # The Flathub manifest installs packaging/flatpak/* from the release
            # tag, so the metainfo must list the version being released. The file
            # keeps a single <release> entry; rewrite it before the tag is cut.
            - name: Render flatpak metainfo release
              run: |
                  sed -i -E "s|<release version=\"[^\"]+\" date=\"[^\"]+\"/>|<release version=\"${{ needs.linux-android-web.outputs.version }}\" date=\"$(date -u +%F)\"/>|" \
                      packaging/flatpak/io.github.dmezhnov.knitcalc.metainfo.xml
                  git add packaging/flatpak/io.github.dmezhnov.knitcalc.metainfo.xml
                  git commit -m "Flatpak metainfo release ${{ needs.linux-android-web.outputs.version }}"

            - name: Download release artifacts
              uses: actions/download-artifact@v8
              with:
                  pattern: release-*
                  path: release-download
                  merge-multiple: true

            - name: Push main and tag
              run: |
                  git remote set-url origin "git@github.com:${GITHUB_REPOSITORY}.git"
                  git push origin HEAD:main
                  git tag "${{ needs.linux-android-web.outputs.tag }}"
                  git push origin "${{ needs.linux-android-web.outputs.tag }}"

            - name: Create GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh release create "${{ needs.linux-android-web.outputs.tag }}" \
                    release-download/*/* \
                    --repo "$GITHUB_REPOSITORY" \
                    --title "KnitCalc ${{ needs.linux-android-web.outputs.version }}" \
                    --notes "Automated release for ${{ needs.linux-android-web.outputs.tag }}"
                  # The bucket/cask commits rendered above are only live once the
                  # push in the previous step landed, so record all three here.
                  version='${{ needs.linux-android-web.outputs.version }}'
                  bash packaging/ci/channel_status.sh github-release ok "$version"
                  bash packaging/ci/channel_status.sh scoop ok "$version"
                  bash packaging/ci/channel_status.sh homebrew ok "$version"

            # The repository page is a listing like any other: its description,
            # website and topics come from packaging/metadata/metadata.yaml via
            # the generated packaging/metadata/github.json, so the GitHub page
            # cannot drift from what the stores show. It runs on the winget PAT,
            # not the built-in token: editing repository settings is not one of
            # the scopes a workflow `permissions:` block can grant.
            - name: Sync GitHub repository listing
              env:
                  GH_TOKEN: ${{ secrets.PACKAGING_GITHUB_TOKEN }}
              run: bash packaging/ci/publish_repo_metadata.sh

            # The app reads the available version from a Firestore document
            # instead of the GitHub API (avoids the 60/hour unauthenticated rate
            # limit, which is shared per IP under carrier-grade NAT). Write the
            # self-update entries here, now the assets exist; the per-store
            # fields (samsung/amazon/…) are bumped by hand once each store
            # publishes and are preserved by the updateMask. continue-on-error
            # keeps a Firestore hiccup from failing the release (and the package
            # manager jobs that need it); skipped when FIREBASE_SA_KEY is unset.
            - name: Publish self-update versions to Firestore
              if: ${{ env.FIREBASE_SA_KEY != '' }}
              env:
                  VERSION: ${{ needs.linux-android-web.outputs.version }}
                  ARTIFACT_DIR: release-download
              run: |
                  set -uo pipefail
                  key="$RUNNER_TEMP/firebase-sa.json"
                  printf '%s' "$FIREBASE_SA_KEY" > "$key"
                  # Mint a token from the SA key via a self-signed JWT (gcloud is
                  # preinstalled). This avoids the IAM Service Account Credentials
                  # API (iamcredentials.googleapis.com), which is not enabled on
                  # the project — unlike google-github-actions/auth access tokens.
                  #
                  # The failure path records the channel and exits 0 instead of
                  # using continue-on-error: the release must not abort here, but
                  # the report job has to see that the banner is stale.
                  status=ok
                  detail="$VERSION"
                  if gcloud auth activate-service-account --key-file="$key" --quiet \
                      && ACCESS_TOKEN="$(gcloud auth print-access-token)" \
                      && ACCESS_TOKEN="$ACCESS_TOKEN" packaging/firebase/publish_store_versions.sh; then
                    :
                  else
                    status=failed
                    detail="gcloud auth or publish_store_versions.sh failed; see this step's log"
                    echo "::warning::Firestore store-versions publish failed; the in-app update banner keeps advertising the previous version."
                  fi
                  rm -f "$key"
                  bash packaging/ci/channel_status.sh firestore "$status" "$detail"

            - name: Note skipped Firestore publish
              if: ${{ env.FIREBASE_SA_KEY == '' }}
              run: |
                  echo "::warning::FIREBASE_SA_KEY is not set; skipping the store-versions publish. The update banner will not appear until the document is updated (see packaging/firebase/README.md)."
                  bash packaging/ci/channel_status.sh firestore skipped "FIREBASE_SA_KEY is not set"

            - name: Upload channel status
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: channel-status-publish
                  path: channel-status
                  if-no-files-found: ignore

    windows-package-managers:
        name: Publish to Windows package managers
        runs-on: windows-latest
        needs:
            - linux-android-web
            - windows
            - publish

        steps:
            - name: Checkout test branch
              uses: actions/checkout@v5
              with:
                  ref: test

            # winget and Chocolatey reject +build metadata in versions, so they
            # get the bare semver; the release asset URL keeps the full version.
            - name: Compute package facts
              id: facts
              shell: pwsh
              run: |
                  $full = '${{ needs.linux-android-web.outputs.version }}'
                  $bare = $full.Split('+')[0]
                  $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$full"
                  # Chocolatey installs the zip; winget installs the inno setup.exe.
                  $url = "$base/knitcalc-windows-x64-$full.zip"
                  $setupUrl = "$base/knitcalc-setup-x64-$full.exe"
                  "full=$full" >> $env:GITHUB_OUTPUT
                  "bare=$bare" >> $env:GITHUB_OUTPUT
                  "url=$url" >> $env:GITHUB_OUTPUT
                  "setup_url=$setupUrl" >> $env:GITHUB_OUTPUT
                  "sha256=${{ needs.windows.outputs.sha256 }}" >> $env:GITHUB_OUTPUT

            - name: Publish to winget and Chocolatey
              uses: ./.github/actions/windows-package-managers
              with:
                  bare: ${{ steps.facts.outputs.bare }}
                  url: ${{ steps.facts.outputs.url }}
                  setup_url: ${{ steps.facts.outputs.setup_url }}
                  sha256: ${{ steps.facts.outputs.sha256 }}
                  packaging_github_token: ${{ secrets.PACKAGING_GITHUB_TOKEN }}
                  choco_api_key: ${{ secrets.CHOCO_API_KEY }}

            - name: Upload channel status
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: channel-status-windows-package-managers
                  path: channel-status
                  if-no-files-found: ignore

    snap-store:
        name: Publish to the Snap Store
        # Pinned (not ubuntu-latest): --destructive-mode packs on the host, so
        # its Ubuntu release must match `base` in snap/snapcraft.yaml (core24).
        runs-on: ubuntu-24.04
        needs:
            - linux-android-web
            - publish

        steps:
            - name: Checkout test branch
              uses: actions/checkout@v5
              with:
                  ref: test

            - name: Download Linux artifacts
              uses: actions/download-artifact@v8
              with:
                  name: release-linux-android-web
                  path: release

            # The snap repacks the release Linux bundle (plugin: dump) — nothing
            # is rebuilt inside snapcraft. Skipped with a warning until the
            # SNAPCRAFT_STORE_CREDENTIALS secret is configured; see
            # packaging/README.md.
            - name: Pack and upload snap
              env:
                  SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
              run: |
                  if [ -z "$SNAPCRAFT_STORE_CREDENTIALS" ]; then
                    echo "::warning::SNAPCRAFT_STORE_CREDENTIALS is not set; skipping the Snap Store."
                    bash packaging/ci/channel_status.sh snap skipped "SNAPCRAFT_STORE_CREDENTIALS is not set"
                    exit 0
                  fi
                  version='${{ needs.linux-android-web.outputs.version }}'
                  mkdir -p build/linux/x64/release/bundle
                  tar -C build/linux/x64/release/bundle \
                      -xzf "release/linux/knitcalc-linux-x64-${version}.tar.gz"
                  sed -i "s|{{VERSION}}|$version|" snap/snapcraft.yaml
                  sudo snap install snapcraft --classic
                  # Root because destructive mode installs the gnome build snaps
                  # on the host; the upload runs unprivileged with the credentials.
                  sudo snapcraft pack --destructive-mode
                  snapcraft upload --release=stable "knitcalc_${version}_amd64.snap"
                  bash packaging/ci/channel_status.sh snap ok "$version"

            - name: Upload channel status
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: channel-status-snap-store
                  path: channel-status
                  if-no-files-found: ignore

    aur:
        name: Publish to the AUR
        runs-on: ubuntu-latest
        needs:
            - linux-android-web
            - publish

        steps:
            - name: Checkout test branch
              uses: actions/checkout@v5
              with:
                  ref: test

            # Renders packaging/aur/ templates against the released tarball and
            # pushes to the knitcalc-bin AUR repo. The first push creates the
            # package base, owned by the AUR account whose SSH key is used.
            # Skipped with a warning until the key secret is configured.
            - name: Push knitcalc-bin to the AUR
              env:
                  AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
              run: |
                  if [ -z "$AUR_SSH_PRIVATE_KEY" ]; then
                    echo "::warning::AUR_SSH_PRIVATE_KEY is not set; skipping the AUR push."
                    bash packaging/ci/channel_status.sh aur skipped "AUR_SSH_PRIVATE_KEY is not set"
                    exit 0
                  fi
                  # The status file must land in the workspace, not in /tmp/aur
                  # the push below cd's into.
                  export CHANNEL_STATUS_DIR="$GITHUB_WORKSPACE/channel-status"
                  version='${{ needs.linux-android-web.outputs.version }}'
                  tarball_sha='${{ needs.linux-android-web.outputs.linux_sha256 }}'
                  license_sha="$(sha256sum LICENSE | cut -d' ' -f1)"

                  mkdir -p ~/.ssh
                  printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
                  chmod 600 ~/.ssh/aur
                  ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
                  export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur"

                  git clone ssh://aur@aur.archlinux.org/knitcalc-bin.git /tmp/aur
                  for f in PKGBUILD SRCINFO; do
                    out=/tmp/aur/$f
                    [ "$f" = SRCINFO ] && out=/tmp/aur/.SRCINFO
                    sed -e "s|{{VERSION}}|$version|g" \
                        -e "s|{{TARBALL_SHA256}}|$tarball_sha|g" \
                        -e "s|{{LICENSE_SHA256}}|$license_sha|g" \
                        "packaging/aur/$f" > "$out"
                  done
                  cd /tmp/aur
                  git config user.name "Dmitry Mezhnov"
                  git config user.email "dmezhnov@users.noreply.github.com"
                  git add PKGBUILD .SRCINFO
                  if git diff --cached --quiet; then
                    echo "AUR package already up to date."
                    bash "$GITHUB_WORKSPACE/packaging/ci/channel_status.sh" aur ok "$version (already up to date)"
                    exit 0
                  fi
                  git commit -m "knitcalc-bin $version"
                  git push origin HEAD:master
                  bash "$GITHUB_WORKSPACE/packaging/ci/channel_status.sh" aur ok "$version"

            - name: Upload channel status
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: channel-status-aur
                  path: channel-status
                  if-no-files-found: ignore

    # mise installs the release assets straight from GitHub, so there is nothing
    # to publish per release. What can break silently is the *install*: an asset
    # rename, a different bundle layout or a runner that stops answering
    # `--version` would make `mise use knitcalc` fail without any store
    # complaining. So this channel reports on a check rather than an upload —
    # the same steps packaging/README.md gives users, and the same command
    # jdx/mise's registry test runs, on all three desktop OSes.
    mise-install:
        name: Verify the mise install
        needs:
            - linux-android-web
            - publish
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: ubuntu-latest
                      channel: mise-linux
                    - os: windows-latest
                      channel: mise-windows
                    - os: macos-latest
                      channel: mise-macos
        runs-on: ${{ matrix.os }}

        steps:
            - name: Checkout test branch
              uses: actions/checkout@v5
              with:
                  ref: test

            # The Linux bundle links GTK, so even `--version` (which answers
            # before the toolkit is touched) needs the shared libraries present
            # for the loader — a bare runner has the runtime but not always this
            # set. Same reason mise's own registry CI needs them; see
            # packaging/README.md.
            - name: Install GTK runtime
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-0 liblzma5

            - name: Install mise
              uses: jdx/mise-action@v4
              with:
                  # Deliberately unpinned, unlike the build jobs: this check is
                  # about what a user's current mise does with our release, and
                  # the pin there works around a Windows *shim* cache
                  # regression that neither `mise exec` nor an uncached run hits.
                  #
                  # Only the mise binary: `mise install` here would build this
                  # repo's own toolchain (Flutter, Dart, Bun).
                  install: false
                  cache: false

            - name: Install knitcalc through mise and check --version
              shell: bash
              env:
                  # Release listing goes through the GitHub API; the default
                  # token lifts the anonymous rate limit.
                  MISE_GITHUB_TOKEN: ${{ github.token }}
              run: |
                  set -uo pipefail
                  export CHANNEL_STATUS_DIR="$GITHUB_WORKSPACE/channel-status"
                  status="$GITHUB_WORKSPACE/packaging/ci/channel_status.sh"
                  channel='${{ matrix.channel }}'
                  version='${{ needs.linux-android-web.outputs.version }}'

                  # Both documented install paths are checked, each in its own
                  # config, data and cache dirs outside the repo: this repo's
                  # mise.toml pulls in the whole build toolchain, and a global
                  # config left by the setup action would be installed too —
                  # `mise install` builds every tool in scope, not just the one
                  # named in the local config.
                  isolate() {
                    work="$RUNNER_TEMP/$1"
                    rm -rf "$work"
                    mkdir -p "$work/config"
                    : > "$work/config/config.toml"
                    export MISE_DATA_DIR="$work/data"
                    export MISE_CACHE_DIR="$work/cache"
                    export MISE_CONFIG_DIR="$work/config"
                    export MISE_GLOBAL_CONFIG_FILE="$work/config/config.toml"
                    export XDG_DATA_HOME="$work/xdg"
                    cd "$work"
                  }

                  # The plugin's post_install hook also makes the app
                  # launchable without a terminal: a .desktop entry on Linux
                  # (in XDG_DATA_HOME above), a ~/Applications alias on macOS
                  # and a Start-menu shortcut on Windows. pre_uninstall takes
                  # it back out — checked here, because a leftover entry
                  # pointing at a removed version is exactly what a user sees.
                  menu_entry() {
                    case "$RUNNER_OS" in
                      Linux) echo "$XDG_DATA_HOME/applications/io.github.dmezhnov.knitcalc.desktop" ;;
                      macOS) echo "$HOME/Applications/KnitCalc.app" ;;
                      *) echo "$APPDATA/Microsoft/Windows/Start Menu/Programs/KnitCalc.lnk" ;;
                    esac
                  }

                  check_menu_entry() {
                    entry="$(menu_entry)"
                    if [ ! -e "$entry" ]; then
                      echo "::warning::plugin: no application entry at $entry on ${{ matrix.os }}."
                      bash "$status" "$channel" failed "plugin installed no application entry"
                      exit 1
                    fi
                    echo "plugin: application entry installed ($entry)"

                    mise uninstall "knitcalc@$version"
                    if [ -e "$entry" ]; then
                      echo "::warning::plugin: $entry survived 'mise uninstall' on ${{ matrix.os }}."
                      bash "$status" "$channel" failed "application entry survived uninstall"
                      exit 1
                    fi
                    echo "plugin: application entry removed on uninstall"
                  }

                  # Runs headless on every runner: the native --version path
                  # must answer without a window, exactly as mise's registry
                  # test needs it to.
                  check_version() {
                    out="$(mise exec -- knitcalc --version)"
                    echo "$1: knitcalc --version -> $out"

                    if [ "$out" != "knitcalc $version" ]; then
                      echo "::warning::$1: knitcalc --version printed '$out', expected 'knitcalc $version'."
                      bash "$status" "$channel" failed "$1: --version printed '$out'"
                      exit 1
                    fi
                  }

                  # 1. The plugin: the repository is its own mise plugin
                  # registry, and the tree rendered onto main by the publish job
                  # is what users clone.
                  isolate mise-plugin
                  if ! mise plugin install knitcalc "https://github.com/${GITHUB_REPOSITORY}"; then
                    echo "::warning::mise plugin install failed on ${{ matrix.os }}."
                    bash "$status" "$channel" failed "plugin install failed"
                    exit 1
                  fi

                  if ! mise use -g "knitcalc@$version"; then
                    echo "::warning::the mise plugin could not install knitcalc $version on ${{ matrix.os }}."
                    bash "$status" "$channel" failed "plugin could not install $version"
                    exit 1
                  fi

                  check_version plugin
                  check_menu_entry

                  # 2. The plugin-less path: the github backend block that
                  # packaging/README.md documents, pinned to this release.
                  isolate mise-backend
                  cat > mise.toml <<EOF
                  [tool_alias]
                  knitcalc = "github:dmezhnov/knitcalc"

                  [tools.knitcalc]
                  version = "$version"

                  [tools.knitcalc.platforms]
                  linux-x64 = { asset_pattern = "knitcalc-linux-x64-*.tar.gz" }
                  windows-x64 = { asset_pattern = "knitcalc-windows-x64-*.zip" }
                  macos-arm64 = { asset_pattern = "knitcalc-macos-*.zip", bin_path = "knitcalc.app/Contents/MacOS" }
                  macos-x64 = { asset_pattern = "knitcalc-macos-*.zip", bin_path = "knitcalc.app/Contents/MacOS" }
                  EOF
                  mise trust mise.toml

                  if ! mise install; then
                    echo "::warning::mise could not install knitcalc $version on ${{ matrix.os }}."
                    bash "$status" "$channel" failed "github backend install failed for $version"
                    exit 1
                  fi

                  check_version backend

                  bash "$status" "$channel" ok "$version (plugin + github backend)"

            - name: Upload channel status
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: channel-status-${{ matrix.channel }}
                  path: channel-status
                  if-no-files-found: ignore

    deploy-pages:
        name: Deploy GitHub Pages
        runs-on: ubuntu-latest
        needs:
            # linux-android-web only for outputs.version in the channel report;
            # publish already depends on it, so this adds no waiting.
            - linux-android-web
            - publish

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - name: Deploy GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5

            # Only for the channel report: the deploy action needs no checkout,
            # but the status helper lives in the repo.
            - name: Checkout test branch
              uses: actions/checkout@v5
              with:
                  ref: test

            - name: Record channel status
              run: bash packaging/ci/channel_status.sh pages ok "${{ needs.linux-android-web.outputs.version }}"

            - name: Upload channel status
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: channel-status-deploy-pages
                  path: channel-status
                  if-no-files-found: ignore

    # Publishing steps stay warn-and-continue so a store outage cannot abort an
    # already-tagged release. This job is what makes a channel that quietly did
    # not update visible: it merges the per-channel status files into a table on
    # the run summary and fails the run (and therefore `mise publish`) if any
    # channel is behind. The release itself is unaffected — re-run the owning
    # job once the cause is fixed, no new version needed.
    channel-report:
        name: Release channel report
        runs-on: ubuntu-latest
        if: always()
        needs:
            - linux-android-web
            - windows
            - apple
            - publish
            - windows-package-managers
            - snap-store
            - aur
            - mise-install
            - deploy-pages

        steps:
            - name: Checkout test branch
              uses: actions/checkout@v5
              with:
                  ref: test

            # A job that died before writing its status uploads no artifact; the
            # report calls those channels `unknown` rather than passing them.
            - name: Download channel statuses
              continue-on-error: true
              uses: actions/download-artifact@v8
              with:
                  pattern: channel-status-*
                  path: channel-status
                  merge-multiple: true

            - name: Report release channels
              run: bash packaging/ci/channel_report.sh
