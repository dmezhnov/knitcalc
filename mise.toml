[settings]
windows_shim_mode = "symlink"
experimental = true
auto_install = true
exec_auto_install = true
not_found_auto_install = true
lockfile = true
all_compile = false

[settings.status]
missing_tools = "always"

# Renamed from the flat settings.task_run_auto_install, which mise deprecated in
# 2026.8 (it warns on every invocation) and drops in 2027.2.
[settings.task]
run_auto_install = true

[plugins]
android-sdk = "https://github.com/mise-plugins/mise-android-sdk"

[tools]
flutter = "3.41.9"
yq = { version = "4.53.2", os = ["linux"] }
java = { version = "17.0.2", os = ["linux"] }
clang = { version = "18.1.8", os = ["linux"] }
cmake = "4.3.3"
ninja = "1.13.2"
firebase = "15.19.1"
trunk = "1.3.4"

[tools.android-sdk]
version = "20.0"
depends = ["yq", "java", "flutter"]
os = ["linux"]
postinstall = """
    yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
    yes | sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-36" "build-tools;35.0.0" "ndk;28.2.13676358"
    mise exec flutter -- flutter config --android-sdk "$ANDROID_HOME"
    mise exec flutter -- flutter doctor -v
"""

[hooks]
# Keep this a single shell string, not an array: newer mise mis-parses the array
# form (it ran `trunk install flutter pub get`), so the pub-get command silently
# never runs and the CI lint sees undefined symbols.
postinstall = "flutter pub get && trunk install"

[tasks.install]
run = "mise i"

[tasks.build]
description = "Build a target platform"
usage = '''
arg "<target>" help="Build target" {
  choices "apk" "apk-split" "appbundle" "web" "linux" "windows" "macos" "ios"
}
'''
# packaging_icons regenerates the repo-resident catalog icons (fastlane,
# flatpak) from the same source, so swapping assets/icon/icon.png updates
# every channel without manual steps; packaging_metadata does the same for the
# listing texts, screenshots and URLs (see the metadata task below).
run = [
    "dart run icons_launcher:create",
    "dart run tool/packaging_icons.dart",
    "dart run tool/packaging_metadata.dart",
    "mise build-{{ usage.target }}",
]

[tasks.build-apk]
hide = true
run = '''
# Bake the pubspec version so the installed APK can compare itself against the
# latest GitHub release (see lib/update/current_version.dart).
app_version="$(yq -r '.version' pubspec.yaml)"
flutter build apk --dart-define=APP_VERSION="$app_version"
'''

[tasks.build-apk-split]
hide = true
run = '''
# Per-ABI APKs stay under IzzyOnDroid's ~30 MB per-file limit (the fat APK
# does not); the release publishes them alongside the universal APK.
app_version="$(yq -r '.version' pubspec.yaml)"
flutter build apk --split-per-abi --dart-define=APP_VERSION="$app_version"
'''

[tasks.build-appbundle]
hide = true
run = '''
app_version="$(yq -r '.version' pubspec.yaml)"
flutter build appbundle --dart-define=APP_VERSION="$app_version"
'''

[tasks.build-web]
hide = true
run = '''
# Bake the pubspec version into the build so the running app can compare itself
# against the deployed version.json (see lib/update/current_version.dart).
app_version="$(yq -r '.version' pubspec.yaml)"
flutter build web --base-href /knitcalc/ --dart-define=APP_VERSION="$app_version"
'''

[tasks.build-linux]
hide = true
run = '''
# Bake the pubspec version so the installed bundle can compare itself against the
# latest GitHub release (see lib/update/current_version.dart). Without this the
# Linux self-updater never detects an update (currentAppVersion() stays null).
app_version="$(yq -r '.version' pubspec.yaml)"

# Flutter's Linux build hardcodes CC=clang/CXX=clang++ and links the GTK stack
# via pkg-config, none of which NixOS exposes on PATH by default. On NixOS,
# build inside an ad-hoc nix-shell that provides the toolchain; other distros
# (including CI) use their own system toolchain directly.
if [ -e /etc/NIXOS ] && command -v nix-shell >/dev/null 2>&1; then
  nix-shell -p clang pkg-config gtk3 fontconfig libepoxy pcre2 libsysprof-capture util-linux \
    --run '
      # nix-shell exposes each package as -L<dir> on NIX_LDFLAGS. GNU ld resolves
      # the engine transitive deps (libepoxy, libfontconfig) via -rpath-link, not
      # -L, and the built bundle needs them on LD_LIBRARY_PATH to launch.
      libdirs=
      for f in $NIX_LDFLAGS; do
        case $f in -L*) libdirs=${libdirs:+$libdirs:}${f#-L} ;; esac
      done
      export NIX_LDFLAGS="$NIX_LDFLAGS -rpath-link $libdirs"
      export LD_LIBRARY_PATH=$libdirs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
      flutter build linux --dart-define=APP_VERSION="'"$app_version"'"
    '
else
  flutter build linux --dart-define=APP_VERSION="$app_version"
fi

# Add desktop integration (icon-theme PNGs, .desktop launcher, install.sh) to
# the bundle; icons_launcher only emits snap assets, so a plain tarball install
# would otherwise have no taskbar icon or menu entry. The packaging step tars
# the whole bundle, so these ship in the release automatically.
dart run tool/linux_desktop_install.dart
'''

[tasks.build-windows]
hide = true
# Bake --dart-define=APP_VERSION so the installed bundle can compare itself
# against the latest GitHub release (see lib/update/current_version.dart);
# without it the Windows self-updater never detects an update. This task only
# runs on Windows (CI), so force pwsh and read the version with a native
# PowerShell regex (yq is linux-only). It must NOT nest `powershell -Command
# "..."`: mise's outer pwsh would variable-expand the double-quoted string and
# corrupt it. The explicit $LASTEXITCODE check keeps a failed build from being
# reported as success. The release CI then wraps this Release dir in the Inno
# Setup installer (packaging/inno/knitcalc.iss), which is how Windows installs
# and self-updates (see lib/update/impl/windows/windows_update_service_io.dart).
#
# The MSVC runtime (msvcp140.dll, vcruntime140*.dll) is copied next to the exe
# so the app is self-contained: a Flutter Windows app links against it, but a
# clean Windows (e.g. the winget validation sandbox) has no VC++ redistributable
# and the app dies with STATUS_DLL_NOT_FOUND (0xC0000135). Shipping the CRT app-
# locally needs no admin, so it works for every channel (installer, zip, self-
# update). The DLLs come from the VS install that Flutter's build already requires.
shell = 'pwsh -NoProfile -Command'
run = '''
$v = [regex]::Match((Get-Content -Raw pubspec.yaml), '(?m)^version:\s*(.+?)\s*$').Groups[1].Value
flutter build windows --dart-define=APP_VERSION=$v
if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
$vswhere = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe"
$vsBase = & $vswhere -latest -property installationPath
if ($LASTEXITCODE -ne 0 -or -not $vsBase) { Write-Error "vswhere could not locate Visual Studio"; exit 1 }
$crt = Get-ChildItem "$vsBase\VC\Redist\MSVC\*\x64\Microsoft.VC*.CRT\*.dll"
if (-not $crt) { Write-Error "No MSVC CRT redistributable DLLs found under $vsBase"; exit 1 }
Copy-Item $crt.FullName build/windows/x64/runner/Release/ -Force
'''

[tasks.build-macos]
hide = true
run = '''
# Bake the pubspec version so the installed .app can compare itself against the
# latest GitHub release (see lib/update/current_version.dart). Without this the
# macOS self-updater never detects an update (currentAppVersion() stays null).
# yq is linux-only and this task only runs on the macOS CI runner, so read the
# version with awk (matching the publish workflow's version-resolve step).
app_version="$(awk '/^version:/ { print $2; exit }' pubspec.yaml)"
flutter build macos --dart-define=APP_VERSION="$app_version"
'''

[tasks.build-ios]
hide = true
run = "flutter build ios --release --no-codesign"

[tasks.test]
run = "flutter test"

[tasks.dev]
run = "mise run dev-{{ os() }}"

[tasks.dev-linux]
hide = true
run = '''
# The harmless GTK/ATK noise this task used to grep out of flutter's output
# (atk_socket_embed, the empty-name cursor-theme message, the UTF8_STRING
# selection warning) is now dropped inside the app itself, by the GLib log writer
# installed in linux/runner/main.cc — in the released binary too, not just here.
# That is why flutter no longer needs a pty (util-linux `script`) wrapper.

# A dev (`flutter run`) build installs no desktop integration, so on Wayland the
# compositor/taskbar can't match the window's app_id to an icon and shows a
# stretched fallback. Install the icon theme + .desktop into ~/.local/share
# first (idempotent, best-effort — don't block the run if it fails).
dart run tool/linux_desktop_install.dart --dev || true

# Same NixOS toolchain workaround as build-linux; LD_LIBRARY_PATH also lets the
# launched app find the GTK stack at run time.
if [ -e /etc/NIXOS ] && command -v nix-shell >/dev/null 2>&1; then
  exec nix-shell -p clang pkg-config gtk3 fontconfig libepoxy pcre2 libsysprof-capture util-linux \
    --run '
      libdirs=
      for f in $NIX_LDFLAGS; do
        case $f in -L*) libdirs=${libdirs:+$libdirs:}${f#-L} ;; esac
      done
      export NIX_LDFLAGS="$NIX_LDFLAGS -rpath-link $libdirs"
      export LD_LIBRARY_PATH=$libdirs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
      # The --dev install above lays down loose icon PNGs; on NixOS many icon
      # consumers (the bar) only read a theme via its icon-theme.cache, and
      # gtk-update-icon-cache is not on the host PATH. gtk3 is in this shell, so
      # build the cache here.
      gtk-update-icon-cache -f -t "$HOME/.local/share/icons/hicolor" 2>/dev/null || true
      flutter run
    '
fi

flutter run
'''

[tasks.dev-macos]
hide = true
run = "flutter run"

[tasks.dev-windows]
hide = true
run = "flutter run"

[tasks.metadata]
description = "Render every store listing from packaging/metadata/metadata.yaml"
run = "dart run tool/packaging_metadata.dart"

[tasks.mise-install-check]
description = "Install a published release through mise (plugin and github backend) and check `knitcalc --version`"
usage = '''
arg "[version]" help="Released version to install, e.g. 1.8.75+98 (default: latest)"
'''
run = '''
set -eu
version="${usage_version:-latest}"
root="$PWD"
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT

# Each check gets its own mise dirs: a bare `mise install` otherwise also
# installs everything the developer's global config lists. XDG_DATA_HOME is
# redirected with them because the plugin's post-install hook writes a desktop
# entry there — pointing at a shim in this throwaway MISE_DATA_DIR, so a real
# ~/.local/share would keep a broken menu entry after the temp dir is gone.
isolate() {
  dir="$work/$1"
  mkdir -p "$dir/config"
  : > "$dir/config/config.toml"
  export MISE_DATA_DIR="$dir/data"
  export MISE_CACHE_DIR="$dir/cache"
  export MISE_CONFIG_DIR="$dir/config"
  export MISE_GLOBAL_CONFIG_FILE="$dir/config/config.toml"
  export XDG_DATA_HOME="$dir/xdg"
  cd "$dir"
}

# Where the plugin's post_install hook puts the app so it can be launched
# without a terminal. Checked for the plugin path only — the github backend runs
# no hooks. Only the Linux location is isolated (XDG_DATA_HOME above); the macOS
# alias and the Windows shortcut land in the real user profile, which is why the
# uninstall check runs right after and takes them back out.
menu_entry() {
  case "$(uname -s)" in
    Linux) echo "$XDG_DATA_HOME/applications/io.github.dmezhnov.knitcalc.desktop" ;;
    Darwin) echo "$HOME/Applications/KnitCalc.app" ;;
    *) echo "$APPDATA/Microsoft/Windows/Start Menu/Programs/KnitCalc.lnk" ;;
  esac
}

check_menu_entry() {
  entry="$(menu_entry)"
  if [ ! -e "$entry" ]; then
    echo "plugin: nothing installed at $entry" >&2
    exit 1
  fi

  case "$(uname -s)" in
    Linux)
      # The entry must launch the shim, not the versioned install directory, or
      # an upgrade would leave the menu on the old build. The hook writes the
      # path blind (mise reshims only after the hook returns), so the shim is
      # what needs checking here.
      if [ ! -x "$MISE_DATA_DIR/shims/knitcalc" ]; then
        echo "plugin: no shim at $MISE_DATA_DIR/shims/knitcalc" >&2
        exit 1
      fi
      if ! grep -q "^Exec=$MISE_DATA_DIR/shims/knitcalc$" "$entry"; then
        echo "plugin: desktop entry does not launch the mise shim:" >&2
        grep "^Exec=" "$entry" >&2
        exit 1
      fi
      if [ ! -f "$XDG_DATA_HOME/icons/hicolor/256x256/apps/io.github.dmezhnov.knitcalc.png" ]; then
        echo "plugin: desktop entry installed without its icon theme" >&2
        exit 1
      fi
      ;;
    Darwin)
      # A symlink into the install tree, not a copy: the app must keep running
      # out of …/mise/installs/… for `Channel.mise` detection.
      case "$(readlink "$entry")" in
        "$MISE_DATA_DIR"/*) ;;
        *) echo "plugin: $entry does not point into $MISE_DATA_DIR" >&2; exit 1 ;;
      esac
      ;;
  esac

  echo "plugin: application entry installed ($entry)"
}

# `mise uninstall` has to take it with it (pre_uninstall hook), or the menu
# keeps an item pointing at files that are gone.
check_menu_entry_removed() {
  entry="$(menu_entry)"
  mise uninstall "knitcalc@$1"

  if [ -e "$entry" ]; then
    echo "plugin: $entry survived 'mise uninstall'" >&2
    exit 1
  fi
  if [ "$(uname -s)" = Linux ] &&
    [ -f "$XDG_DATA_HOME/icons/hicolor/256x256/apps/io.github.dmezhnov.knitcalc.png" ]; then
    echo "plugin: icons survived 'mise uninstall'" >&2
    exit 1
  fi

  echo "plugin: application entry removed on uninstall"
}

check_version() {
  out="$(mise exec -- knitcalc --version)"
  echo "$1: $out"
  case "$out" in
    "knitcalc "*) ;;
    *) echo "$1: unexpected output from 'knitcalc --version'" >&2; exit 1 ;;
  esac
  if [ "$version" != latest ] && [ "$out" != "knitcalc $version" ]; then
    echo "$1: expected 'knitcalc $version'" >&2
    exit 1
  fi
}

# 1. The plugin, from the working tree rather than from main: mise clones
# plugins with git, so the rendered tree becomes a throwaway repo first. These
# are the files the publish job copies to the root of main.
plugin="$work/plugin"
mkdir -p "$plugin"
cp -R "$root/packaging/mise/plugin/." "$plugin/"
git -C "$plugin" init -q -b main
git -C "$plugin" add -A
git -C "$plugin" -c user.email=mise@localhost -c user.name=mise commit -qm knitcalc

isolate plugin-check
mise plugin install knitcalc "file://$plugin"
mise use -g "knitcalc@$version"
check_version plugin
check_menu_entry
# `latest` resolves to a concrete version only after the install.
check_menu_entry_removed "$(mise exec -- knitcalc --version | sed 's/^knitcalc //')"

# 2. The plugin-less path: the github backend block from packaging/README.md.
isolate backend-check
cat > mise.toml <<EOF
[tool_alias]
knitcalc = "github:dmezhnov/knitcalc"

[tools.knitcalc]
version = "$version"

[tools.knitcalc.platforms]
linux-x64 = { asset_pattern = "knitcalc-linux-x64-*.tar.gz" }
windows-x64 = { asset_pattern = "knitcalc-windows-x64-*.zip" }
macos-arm64 = { asset_pattern = "knitcalc-macos-*.zip", bin_path = "knitcalc.app/Contents/MacOS" }
macos-x64 = { asset_pattern = "knitcalc-macos-*.zip", bin_path = "knitcalc.app/Contents/MacOS" }
EOF
mise trust mise.toml
mise install
check_version backend
'''

[tasks.lint]
# The --check pass fails if any channel's listing (winget, Scoop, Chocolatey,
# Homebrew, apt, AUR, rpm, Snap, Flathub, fastlane, the Inno installer, the
# GitHub repo listing) drifted from packaging/metadata/metadata.yaml. It runs
# first: a stale listing is a one-command fix (`mise metadata`) and there is no
# point linting output that is about to be regenerated.
run = ["dart run tool/packaging_metadata.dart --check", "trunk check --all"]

[tasks.format]
run = "trunk fmt"

[tasks.publish]
description = "Bump version in pubspec.yaml, commit all changes, push to test, and stream the release run"
usage = '''
arg "<version>" help="New version for pubspec.yaml, e.g. 1.1.1+3"
arg "<message>" help="Commit message for the release commit"
'''
run = '''
{%- if os() == "windows" -%}
powershell -NoProfile -Command "$ErrorActionPreference='Stop'; $p='pubspec.yaml'; $raw=Get-Content -Raw $p; $new=[regex]::Replace($raw, '(?m)^version:[^\r\n]*', 'version: '+$env:usage_version); [IO.File]::WriteAllText((Resolve-Path $p).Path, $new, (New-Object Text.UTF8Encoding $false)); git add -A; if($LASTEXITCODE){exit 1}; git commit -m $env:usage_message; if($LASTEXITCODE){exit 1}; git push origin HEAD:test --force-with-lease; if($LASTEXITCODE){exit 1}; if(Get-Command gh -ErrorAction SilentlyContinue){ $sha=(git rev-parse HEAD).Trim(); $id=$null; foreach($i in 1..10){ Start-Sleep -Seconds 3; $id = gh run list --branch test --limit 10 --json databaseId,headSha --jq ('map(select(.headSha==\"'+$sha+'\")) | .[0].databaseId'); if($id){break} }; if($id){ gh run watch $id --exit-status; $w=$LASTEXITCODE; $repo=(gh repo view --json nameWithOwner --jq .nameWithOwner).Trim(); Write-Host ''; Write-Host 'Release channels:'; foreach($j in (gh api ('repos/'+$repo+'/actions/runs/'+$id+'/jobs') --jq '.jobs[].id')){ gh api ('repos/'+$repo+'/check-runs/'+$j+'/annotations') --jq '.[] | \"  \" + (.annotation_level | ascii_upcase) + \": \" + .message' 2>$null }; exit $w } else { Write-Host 'Release run not found yet; check GitHub Actions manually.' } } else { Write-Host 'gh CLI not found; skipping run watch.' }"
{%- else -%}
grep -qE '^version: ' pubspec.yaml || { echo "pubspec.yaml: no 'version:' line found" >&2; exit 1; }
tmp="$(mktemp)"
sed -E "s|^version: .*|version: ${usage_version}|" pubspec.yaml > "$tmp" && mv "$tmp" pubspec.yaml
git add -A
git commit -m "${usage_message}"
git push origin HEAD:test --force-with-lease

if ! command -v gh >/dev/null 2>&1; then
  echo "gh CLI not found; skipping run watch." >&2
  exit 0
fi

# Match the run by the pushed commit SHA, not just "latest", to avoid
# attaching to an unrelated run. The run can take a few seconds to register.
sha="$(git rev-parse HEAD)"
run_id=""
for _ in $(seq 1 10); do
  sleep 3
  run_id="$(gh run list --branch test --limit 10 --json databaseId,headSha \
    --jq "map(select(.headSha==\"${sha}\")) | .[0].databaseId" 2>/dev/null || true)"
  [ -n "$run_id" ] && break
done

if [ -z "$run_id" ]; then
  echo "Release run not found yet; check GitHub Actions manually." >&2
  exit 0
fi

watch_status=0
gh run watch "$run_id" --exit-status || watch_status=$?

# `gh run watch` only reports job conclusions, and every package-manager step is
# warn-and-continue by design (a store outage must not abort a tagged release),
# so a channel that did not update leaves the stream all-green. The per-channel
# verdicts ride out as annotations from the "Release channel report" job — print
# them here, or the terminal keeps the silence gh does.
repo="$(gh repo view --json nameWithOwner --jq .nameWithOwner)"
echo
echo "Release channels:"
gh api "repos/${repo}/actions/runs/${run_id}/jobs" --jq '.jobs[].id' | while read -r job_id; do
  gh api "repos/${repo}/check-runs/${job_id}/annotations" \
    --jq '.[] | "  \(.annotation_level | ascii_upcase): \(.message)"' 2>/dev/null || true
done

exit "$watch_status"
{%- endif -%}
'''
