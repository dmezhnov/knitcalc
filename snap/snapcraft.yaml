# Snap package, published by the `snap-store` job of
# .github/workflows/publish.yml: the job fills {{VERSION}} in and packs the
# release Linux bundle as-is (plugin: dump) — nothing is rebuilt inside
# snapcraft. The job packs with --destructive-mode on a runner whose Ubuntu
# matches `base`, so the bundle's glibc lines up.
name: knitcalc
title: KnitCalc
version: '{{VERSION}}'
summary: 'Knitting calculator: gauge conversion, stitch counts, yarn estimation'
description: |
    KnitCalc is a cross-platform helper for the arithmetic of knitting: it converts counts between gauges, distributes increases and decreases evenly across a row, and estimates how much yarn a project needs.

    - Gauge conversion between a swatch and a pattern
    - Even distribution of increases and decreases
    - Yarn usage estimation
    - Project notes with photos, optionally synced between devices
license: MIT
website: https://dmezhnov.github.io/knitcalc/
source-code: https://github.com/dmezhnov/knitcalc
issues: https://github.com/dmezhnov/knitcalc/issues

confinement: strict
base: core24
grade: stable

platforms:
    amd64:

apps:
    knitcalc:
        command: knitcalc
        # gnome brings the GTK/Mesa runtime Flutter links against.
        extensions: [gnome]
        plugs:
            - network
            - home

parts:
    knitcalc:
        plugin: dump
        source: build/linux/x64/release/bundle
